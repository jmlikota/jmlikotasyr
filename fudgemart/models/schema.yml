version: 2

models:
  - name: dim_orders
    description: "Dimension table for orders from Fudgemart and Fudgeflix"
    columns:
      - name: orderkey
        description: "Surrogate key for the order dimension"
        tests:
          - unique
          - not_null
      - name: orderid
        description: "Original order ID from source systems"
        tests:
          - not_null
      - name: division
        description: "Source system: Fudgemart or Fudgeflix"
        tests:
          - not_null
      - name: order_date
        description: "Date the order was placed"
        tests:
          - not_null
      - name: shipped_date
        description: "Date the order was shipped"
      - name: returned_date
        description: "Date the item was returned (Fudgeflix only)"
      - name: ship_via
        description: "Shipping method (Fudgemart only)"
      - name: customer_id
        description: "Customer key from source system"
        tests:
          - not_null